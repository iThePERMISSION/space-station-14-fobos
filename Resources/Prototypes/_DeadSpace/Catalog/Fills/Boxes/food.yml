- type: entity
  id: Gumbox
  name: пачка жвачек
  description: Розовая прям как то, что в ней.
  parent: BaseStorageItem
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Storage/gumbox.rsi
    layers:
      - map: [ base ]
        state: close
  - type: Item
    sprite: _DeadSpace/Objects/Storage/gumbox.rsi
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,2,3
  - type: StorageFill
    contents:
    - id: FoodChewedgum
    - id: FoodChewedgum
    - id: FoodChewedgum
    - id: FoodChewedgum
    - id: FoodChewedgum
  - type: Item
    size: Normal
    shape:
    - 0,0,2,3
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: open }
          False: { state: close }
  - type: Appearance