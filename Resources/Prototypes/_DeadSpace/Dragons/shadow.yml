# Астральные версии
- type: entity
  id: Astral
  save: false
  abstract: true
  parent: BaseMob
  description: Mobs without physical bodies
  components:
  - type: Sprite
    noRot: true
    overrideContainerOcclusion: true # Always show up regardless of where they're contained.
    drawdepth: Ghosts
  - type: FTLSmashImmune
  - type: AntagImmune
  - type: FlashImmunity
  - type: ImmunEgg
  - type: ImmunNecroobelisk
  - type: ImmunitetInfectionDead
  - type: CargoSellBlacklist
  - type: MovementSpeedModifier
    baseSprintSpeed: 7
    baseWalkSpeed: 4
  - type: MovementIgnoreGravity
  - type: Physics
    bodyType: KinematicController
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
        layer:
        - GhostImpassable

- type: entity
  parent:
  - Astral
  id: MobAstralCarp
  name: прозрачный карп
  description: Жутко!
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Dragons/Carps/shadow.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: astral

- type: entity
  parent:
  - Astral
  id: MobAstralDragon
  name: прозрачный дракон
  description: Жутко!
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Dragons/shadow.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: astral

# Экшнс
- type: entity
  id: ActionShadowDragonsBreath
  name: "[color=blue]ЭМИ заряд[/color]"
  description: Запустите ЭМИ импульс и выведите из строя вражеское лазерное вооружение и приборы!
  components:
  - type: WorldTargetAction
    icon: { sprite : Objects/Weapons/Guns/Projectiles/magic.rsi, state: bluespace }
    event: !type:ActionGunShootEvent
    priority: 2
    checkCanAccess: false
    range: 0
    itemIconStyle: BigAction

- type: entity
  id: ActionAstralDragon
  name: Переход в астрал
  description: 3 секунды полной неуязвимости и неосизаемости! Но и урона нанести вы не сможете...
  components:
  - type: InstantAction
    useDelay: 120
    event: !type:PolymorphActionEvent
      protoId: AstralShadowDragon
    itemIconStyle: NoItem
    icon:
      sprite: _DeadSpace/Dragons/shadow.rsi
      state: astral

- type: entity
  id: ActionAstralCarp
  name: Переход в астрал
  description: 2 секунды полной неуязвимости и неосизаемости! Но и урона нанести вы не сможете нанести...
  components:
  - type: InstantAction
    useDelay: 30
    event: !type:PolymorphActionEvent
      protoId: AstralShadowCarp
    itemIconStyle: NoItem
    icon:
      sprite: _DeadSpace/Dragons/Carps/shadow.rsi
      state: astral

- type: entity
  parent: BaseAction
  id: ActionSpawnShadowRift
  name: Призвать теневой разлом
  description: Призывает теневых сущностей, которые готовы покрыть всё мраком.
  components:
  - type: Action
    icon:
      sprite: Structures/Specific/Anomalies/shadow_anom.rsi
      state: anom
    useDelay: 1
    priority: 3
  - type: InstantAction
    event: !type:DragonSpawnRiftActionEvent

# Полиморфы
- type: polymorph
  id: AstralShadowDragon
  configuration:
    entity: MobAstralDragon
    forced: true
    transferName: true
    transferHumanoidAppearance: true
    inventory: Drop
    revertOnDeath: false
    revertOnCrit: false
    duration: 3

- type: polymorph
  id: AstralShadowCarp
  configuration:
    entity: MobAstralCarp
    forced: true
    transferName: true
    transferHumanoidAppearance: true
    inventory: Drop
    revertOnDeath: false
    revertOnCrit: false
    duration: 2