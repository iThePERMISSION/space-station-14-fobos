    min: 10m
    max: 15m
  price: 100000
  spawns:
    - id: RandomHumanoidSpawnerCBURNLeader
      amount: 1
    - id: RandomHumanoidSpawnerCBURNAgent
      amount: 10

- type: ertTeam
  id: Engineers
  name: Инженеры
  description: 
    Отряд инженеров NanoTrasen, специализирующихся на ремонте и техническом обслуживании
    космических станций и кораблей. Они обладают обширными знаниями в области
    инженерии, систем жизнеобеспечения и ремонта оборудования.
    4 инженера прибывают на инженерном шаттле, оснащённом всем необходимым оборудованием
    для выполнения их миссии.
    Время прибытия отряда от 5 до 10 минут.
  rule: SpawnEngineersShuttle
  spawnWindow:
    min: 5m
    max: 10m
  price: 20000
  spawns:
    - id: RandomHumanoidSpawnerERTLeaderAmber
      amount: 1
    - id: RandomHumanoidSpawnerERTEngineerAmber
      amount: 3

- type: ertTeam
  id: Amber
  name: Эмбер
  description: 
    Отряд быстрого реагирования "Эмбер" NanoTrasen, предназначенный для
    проведения разведывательных операций и оказания поддержки силам
    Службы Безопасности в борьбе с незначительными угрозами, в случае 
    если текущий состав слишком мал. 
    5 членов отряда прибывают на шаттле "Эмбер", который оснащён всем
    необходимым оборудованием для выполнения их миссии.
    Время прибытия отряда от 5 до 10 минут.
  rule: SpawnAmberShuttle
  spawnWindow:
    min: 5m
    max: 10m
  price: 25000
  spawns:
    - id: RandomHumanoidSpawnerERTLeaderAmber
      amount: 1
    - id: RandomHumanoidSpawnerERTEngineerAmber
      amount: 1
    - id: RandomHumanoidSpawnerERTSecurityAmber
      amount: 2
    - id: RandomHumanoidSpawnerERTMedicalAmber
      amount: 1

- type: ertTeam
  id: Gamma
  name: Гамма
  description: 
    Отряд специального назначения NanoTrasen, предназначенный для
    быстрого реагирования на чрезвычайные ситуации и угрозы безопасности на
    космических станциях и кораблях. Они обучены для выполнения различных
    задач. В основе их деятельности лежит защита станций от вторжения извне.
    8 членов отряда и их лидер прибывают на шаттле "Гамма", который оснащён всем
    необходимым оборудованием для выполнения их миссии.
    Время прибытия отряда 20 минут.
  rule: SpawnGammaShuttle
  spawnWindow:
    min: 20m
    max: 20m
  price: 100000
  spawns:
    - id: RandomHumanoidSpawnerERTLeaderGamma
      amount: 1
    - id: RandomHumanoidSpawnerERTEngineerGamma
      amount: 1
    - id: RandomHumanoidSpawnerERTSecurityGamma
      amount: 5
    - id: RandomHumanoidSpawnerERTMedicalGamma
      amount: 2

- type: ertTeam
  id: BSAA
  name: АПБТ
  description: 
    Альянс Противодействия Биологической и Террористической угрозе NanoTrasen, 
    предназначенный очистить станцию от биологической и террористической угрозы.
    Данный отряд отправляется при вторжении террористов "Круг" или в случае масштабного всплеска ред-спейс.
    Время прибытия отряда от 20 до 25 минут.
  rule: SpawnSierraShuttle
  spawnWindow:
    min: 20m
    max: 25m
  price: 125000
  spawns:
    - id: RandomHumanoidSpawnerBSAALeader
      amount: 1
    - id: RandomHumanoidSpawnerBSAAMedic
      amount: 2
    - id: RandomHumanoidSpawnerBSAAFighter
      amount: 7

- type: ertTeam
  id: CentralCommandOfficial
  name: Представитель ЦК
  description: 
    Представитель Центрального Командования NanoTrasen, прибывающий на станцию
    для решения возникших проблем, которые не могут быть решены обычным способом.
    Представитель Центрального Командования и 3 офицера "Синий Щит" прибывают
    на шаттле, который оснащён всем необходимым оборудованием
    для выполнения их миссии.
    Время прибытия от 5 до 7 минут.
  rule: SpawnCentCommOfficialShuttle
  cancelMessage: 
    Представитель Центрального Командования NanoTrasen не смог прибыть на станцию
    из-за непредвиденных обстоятельств. Мы приносим извинения за возможные неудобства.
  spawnWindow:
    min: 5m
    max: 7m
  price: 0
  special: CustomizableSpawnerCentralCommandOfficial
  spawns:
    - id: CustomizableSpawnerCentralCommandBlueShieldOfficer
      amount: 3